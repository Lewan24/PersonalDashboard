services:
  personal-hub:
    image: lewan24/personal-dashboard:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Data Source=/app/data/dashboard.db;Foreign Keys=True;Default Timeout=5
      AllowedHosts: "${ALLOWED_HOSTS:-localhost;127.0.0.1;[::1]}"
      TZ: "${TZ:-Europe/Warsaw}"
    volumes:
      - personal_hub_data:/app/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, dotnet, PersonalHub.Api.dll, --healthcheck]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  personal_hub_data:
